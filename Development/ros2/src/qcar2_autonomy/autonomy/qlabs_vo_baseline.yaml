# qlabs_vo_baseline.yaml
# ──────────────────────────────────────────────────────────
# Validated QLabs baseline parameters for VO redundancy
# monitor (vo_node v5, Part 2 complete).
#
# Every parameter name below matches a declare_parameter()
# call in vo_node_v5.py. Misspelled names are silently
# ignored by ROS2, so this was verified against the code.
#
# Launch:
#   ros2 run qcar2_autonomy vo_node --ros-args \
#       --params-file qlabs_vo_baseline.yaml
# ──────────────────────────────────────────────────────────
vo_node:
  ros__parameters:
    # ── Depth Decoding (QLabs SCALE mode) ──
    depth_shift_bits: 0
    depth_scale: 15.7
    depth_unit_m: 0.001

    # ── Intrinsics Override (QLabs virtual camera) ──
    fx_override: 161.0
    fy_override: 161.0

    # ── VO Engine Tuning ──
    n_features: 1200
    match_ratio: 0.80
    depth_ratio_max: 8.0
    negate_deltas: true

    # ── Sliding Window + Decision Logic ──
    window_seconds: 2.0
    min_window_samples: 15
    n_consecutive: 3
    trans_thresh_m: 0.35
    turn_gate_deg: 5.0

    # ── Part 2: Weighted Trust ──
    spread_bad: 55.0
    spread_good: 120.0
    min_vo_weight: 0.30
    min_vo_conf: 0.15
    min_vo_inliers: 20

    # ── Re-anchor ──
    reanchor_on_agree: true
    min_reanchor_dist_m: 0.25
    reanchor_cooldown_s: 8.0
    warmup_after_reanchor_s: 1.0

    # ── Timing ──
    vo_rate_hz: 20.0
    tf_stale_timeout_s: 0.50
    camera_stale_timeout_s: 1.00
    max_sync_skew_s: 0.05

    # ── TF Frame ──
    target_frame: base_link

    # ── Diagnostics ──
    vo_scale_test: 1.0